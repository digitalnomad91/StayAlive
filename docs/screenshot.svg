<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="StayAlive app preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)" />
  <rect x="80" y="70" width="1040" height="580" rx="36" fill="#0b1220" opacity="0.7" />
  <text x="120" y="140" font-family="'Segoe UI', sans-serif" font-size="44" fill="#f8fafc" font-weight="700">StayAlive</text>
  <text x="120" y="180" font-family="'Segoe UI', sans-serif" font-size="20" fill="#cbd5f5">A harm-reduction companion that checks in when it matters.</text>
  <rect x="120" y="220" width="400" height="46" rx="23" fill="#1e293b" />
  <rect x="120" y="220" width="200" height="46" rx="23" fill="#34d399" />
  <text x="170" y="250" font-family="'Segoe UI', sans-serif" font-size="16" fill="#0f172a" font-weight="600">Safety timer</text>
  <text x="350" y="250" font-family="'Segoe UI', sans-serif" font-size="16" fill="#cbd5f5">Support</text>
  <rect x="120" y="290" width="960" height="160" rx="24" fill="#0b1220" opacity="0.6" stroke="#1f2937" />
  <text x="150" y="330" font-family="'Segoe UI', sans-serif" font-size="18" fill="#f8fafc" font-weight="600">Current status</text>
  <text x="150" y="380" font-family="'Segoe UI', sans-serif" font-size="48" fill="#f8fafc" font-weight="700">02:00</text>
  <text x="150" y="415" font-family="'Segoe UI', sans-serif" font-size="16" fill="#94a3b8">Location not available yet.</text>
  <rect x="120" y="470" width="320" height="56" rx="28" fill="#34d399" />
  <text x="170" y="505" font-family="'Segoe UI', sans-serif" font-size="18" fill="#0f172a" font-weight="700">Start safety timer</text>
  <rect x="120" y="560" width="960" height="70" rx="20" fill="#1f2937" opacity="0.8" />
  <text x="150" y="600" font-family="'Segoe UI', sans-serif" font-size="14" fill="#e2e8f0">Safety note: This is a prototype. Always call emergency services if someone is unresponsive.</text>
</svg>
